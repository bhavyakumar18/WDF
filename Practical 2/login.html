<main>

    <h2>Student Login</h2>

    <p>Login to your student account.</p>

    <form style="background-color:white; width:350px; margin:auto; padding:30px;">

        <fieldset>

            <legend>Login</legend>

            <br>

            <label>Username</label>

            <br>

            <input type="text"
                   placeholder="Enter username"
                   required>

            <br><br>

            <label>Password</label>

            <br>

            <input type="password"
                   placeholder="Enter password"
                   required>

            <br><br>

            <input type="checkbox">

            <label>Remember Me</label>

            <br><br>

            <input type="submit"
                   value="Login">

            <input type="reset"
                   value="Clear">

            <br><br>

            <a href="contact.html">Create New Account</a>

        </fieldset>

    </form>
