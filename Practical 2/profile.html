<main>

<h2>Student Profile</h2>

<form style="background-color:white; width:500px; margin:auto; padding:25px;">

<fieldset>

<legend><strong>Personal Details</strong></legend>

<br>

<label>Full Name</label>
<br>
<input type="text" placeholder="Enter your full name" required>

<br><br>

<label>Father Name</label>
<br>
<input type="text" placeholder="Enter father name">

<br><br>

<label>Mother Name</label>
<br>
<input type="text" placeholder="Enter mother name">

<br><br>

<label>Email</label>
<br>
<input type="email" placeholder="Enter your email" required>

<br><br>

<label>Phone Number</label>
<br>
<input type="tel" placeholder="Enter phone number">

<br><br>

<label>Date of Birth</label>
<br>
<input type="date">

<br><br>

<label>Gender</label>
<br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other

<br><br>

<label>Student Photo</label>
<br>
<input type="file">

</fieldset>

<br>

<fieldset>

<legend><strong>School Details</strong></legend>

<br>

<label>Roll Number</label>
<br>
<input type="number" placeholder="Enter roll number">

<br><br>

<label>Class</label>
<br>

<select>

    <option>Select Class</option>
    <option>8th</option>
    <option>9th</option>
    <option>10th</option>
    <option>11th</option>
    <option>12th</option>

</select>

<br><br>

<label>Section</label>
<br>

<select>

    <option>Select Section</option>
    <option>A</option>
    <option>B</option>
    <option>C</option>

</select>

<br><br>

<label>Course</label>
<br>

<select>

    <option>Select Course</option>
    <option>Computer</option>
    <option>Science</option>
    <option>Mathematics</option>
    <option>English</option>

</select>

</fieldset>

<br>

<fieldset>

<legend><strong>Address Details</strong></legend>

<br>

<label>Address</label>
<br>

<textarea rows="4"
          cols="40"
          placeholder="Enter your address"></textarea>

<br><br>

<label>City</label>
<br>
<input type="text" placeholder="Enter city">

<br><br>

<label>State</label>
<br>

<select>

    <option>Select State</option>
    <option>Gujarat</option>
    <option>Maharashtra</option>
    <option>Rajasthan</option>
    <option>Madhya Pradesh</option>

</select>

<br><br>

<label>Pin Code</label>
<br>
<input type="number" placeholder="Enter pin code">

</fieldset>

<br>

<fieldset>

<legend><strong>Other Details</strong></legend>

<br>

<label>Hobbies</label>
<br>

<input type="checkbox"> Reading
<input type="checkbox"> Sports
<input type="checkbox"> Music
<input type="checkbox"> Drawing

<br><br>

<label>About Yourself</label>
<br>

<textarea rows="5"
          cols="40"
          placeholder="Write about yourself"></textarea>

<br><br>

<label>Admission Date</label>
<br>
<input type="date">

</fieldset>

<br>

<input type="submit" value="Save Profile">

<input type="reset" value="Clear">

</form>

</main>

<hr>

</body>
</html>
